name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 ./scripts/verify-agent-docs.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build ./...

  flutter_workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: flutter_version
        shell: bash
        run: echo "version=$(cat desktop/gui_shell/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.version }}
      - shell: bash
        run: dart pub get
      - shell: bash
        run: dart pub workspace list
      - shell: bash
        run: cd packages/flutter_shell_core && flutter analyze
      - shell: bash
        run: cd packages/flutter_shell_core && flutter test
      - shell: bash
        run: cd desktop/gui_shell && flutter analyze
      - shell: bash
        run: cd desktop/gui_shell && flutter test
      - shell: bash
        run: cd mobile/gui_shell && flutter analyze
      - shell: bash
        run: cd mobile/gui_shell && flutter test

  windows_gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: flutter_version
        shell: bash
        run: echo "version=$(cat desktop/gui_shell/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.version }}
      - shell: bash
        run: bash ./scripts/build-go-matrix.sh windows/amd64
      - shell: pwsh
        run: ./scripts/build-gui-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gui
          path: dist/windows-gui

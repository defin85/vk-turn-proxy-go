name: release-artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android_apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - id: flutter_version
        shell: bash
        run: echo "version=$(cat mobile/gui_shell/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
      - name: Build APK
        shell: bash
        run: make build-gui-android
      - uses: actions/upload-artifact@v4
        with:
          name: relaydock-android-debug-apk
          path: |
            dist/mobile/android-gui-shell/app-debug.apk
            dist/mobile/android-gui-shell/app-debug.apk.sha1
            dist/mobile/android-gui-shell/build-metadata.json
          if-no-files-found: error

  windows_exe:
    name: Windows EXE bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: flutter_version
        shell: bash
        run: echo "version=$(cat desktop/gui_shell/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true
      - name: Build Windows GUI bundle
        shell: bash
        run: bash ./scripts/build-go-matrix.sh windows/amd64
      - shell: pwsh
        run: ./scripts/build-gui-windows.ps1
      - name: Compress EXE bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Compress-Archive -Path dist/windows-gui/* -DestinationPath dist/release/relaydock-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: relaydock-windows-x64-exe-bundle
          path: dist/release/relaydock-windows-x64.zip
          if-no-files-found: error

  ubuntu_deb:
    name: Ubuntu DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: flutter_version
        shell: bash
        run: echo "version=$(cat desktop/gui_shell/.flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          cache: true
      - name: Install Linux desktop packaging dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            dpkg-dev \
            libgtk-3-dev \
            liblzma-dev \
            ninja-build \
            pkg-config
      - name: Build Ubuntu Linux GUI stage
        shell: bash
        run: make build-gui-linux
      - name: Build Debian package
        shell: bash
        run: make package-gui-linux-deb
      - uses: actions/upload-artifact@v4
        with:
          name: relaydock-ubuntu-amd64-deb
          path: |
            dist/linux-deb/*.deb
            dist/linux-deb/*.deb.sha256
          if-no-files-found: error

  github_release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - android_apk
      - windows_exe
      - ubuntu_deb
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/release-artifacts
      - name: Flatten release artifacts
        shell: bash
        run: |
          mkdir -p dist/release
          find dist/release-artifacts -maxdepth 3 -type f -print -exec cp '{}' dist/release/ ';'
          find dist/release -maxdepth 1 -type f -print | sort
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*
          fail_on_unmatched_files: true

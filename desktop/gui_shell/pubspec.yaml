name: gui_shell
description: "Desktop GUI shell for vk-turn-proxy-go."
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ^3.11.4

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_shell_i18n: ^0.1.0
  flutter_shell_core: ^0.1.0
  file_selector: ^1.0.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
